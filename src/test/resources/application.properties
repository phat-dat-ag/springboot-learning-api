services.jwks.base-url=http://127.0.0.1:1
services.jwks.get-public-keys=/api/v1/jwks/user
services.user.base-url=http://127.0.0.1:1
services.user.get-user=/internal/users
services.user.connect-timeout=3s
services.user.read-timeout=5s
app.security.jwt.jwk-set-uri=http://127.0.0.1:1/api/v1/jwks/user
app.security.jwt.issuer=japaneselearning-user-service
app.security.jwt.clock-skew=60s
spring.jackson.default-property-inclusion=non_null

spring.application.name=learning-api
app.instance-id=test-instance
app.version=1.0
