services.jwks.base-url=http://127.0.0.1:1
services.jwks.get-public-keys=/.well-known/jwks.json
app.security.jwt.jwk-set-uri=http://127.0.0.1:1/.well-known/jwks.json
app.security.jwt.issuer=japaneselearning-user-service
app.security.jwt.clock-skew=60s
spring.jackson.default-property-inclusion=non_null
