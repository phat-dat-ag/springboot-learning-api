spring.application.name=${SPRING_APPLICATION_NAME:learning-api}

app.instance-id=${APP_INSTANCE_ID:${HOSTNAME:${COMPUTERNAME:${random.uuid}}}}
app.version=${APP_VERSION:@project.version@}

# HTTP server (override per local or container deployment).
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Logging
# APP_LOG_DIR, APP_NAME and LOG_LEVEL are consumed by logback-spring.xml.
logging.include-application-name=false

# Match the user API response envelope by omitting null fields.
spring.jackson.default-property-inclusion=non_null

# JWKS Service HTTP client
services.jwks.base-url=${JWKS_SERVICE_BASE_URL}
services.jwks.get-public-keys=${JWKS_SERVICE_GET_PUBLIC_KEYS}

# User Service HTTP client
services.user.base-url=${USER_SERVICE_BASE_URL:http://user-api:8080}
services.user.get-user=${USER_SERVICE_GET_USER:/internal/users}
services.user.connect-timeout=${USER_SERVICE_CONNECT_TIMEOUT:3s}
services.user.read-timeout=${USER_SERVICE_READ_TIMEOUT:5s}
# Enable only after User Service trusts Learning's internal issuer and signing keys.
services.user.internal-jwt-enabled=${USER_SERVICE_INTERNAL_JWT_ENABLED:false}

# Independent JWKS Service; no issuer discovery or User Service verification calls.
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.clock-skew=${JWT_CLOCK_SKEW:60s}

# Outbound service identity signing, independent of inbound user JWT validation.
app.security.internal-jwt.enabled=${LEARNING_INTERNAL_JWT_ENABLED:false}
app.security.internal-jwt.issuer=${LEARNING_INTERNAL_JWT_ISSUER:learning-service}
app.security.internal-jwt.audience=${LEARNING_INTERNAL_JWT_AUDIENCE:user-service}
app.security.internal-jwt.ttl=${LEARNING_INTERNAL_JWT_TTL:60s}

# Learning's own indexed private keys, supplied by .env.learning-api in Compose.
# Additional indexed keys bind directly through APP_SECURITY_SIGNING_KEYS_<n>_*.
app.security.signing.keys[0].kid=${APP_SECURITY_SIGNING_KEYS_0_KID:}
app.security.signing.keys[0].private-key-path=${APP_SECURITY_SIGNING_KEYS_0_PRIVATEKEYPATH:}
app.security.signing.keys[0].active=${APP_SECURITY_SIGNING_KEYS_0_ACTIVE:false}

# PostgreSQL: supply deployment-specific credentials; no credential defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
