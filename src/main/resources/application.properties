spring.application.name=${SPRING_APPLICATION_NAME:learning-api}

app.instance-id=${APP_INSTANCE_ID:${HOSTNAME:${COMPUTERNAME:${random.uuid}}}}
app.version=${APP_VERSION:@project.version@}

# HTTP server (override per local or container deployment).
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Logging
# APP_LOG_DIR, APP_NAME and LOG_LEVEL are consumed by logback-spring.xml.
logging.include-application-name=false

# Match the user API response envelope by omitting null fields.
spring.jackson.default-property-inclusion=non_null

# JWKS Service HTTP client
services.jwks.base-url=${JWKS_SERVICE_BASE_URL}
services.jwks.get-public-keys=${JWKS_SERVICE_GET_PUBLIC_KEYS}

# User Service HTTP client
services.user.base-url=${USER_SERVICE_BASE_URL:http://user-api:8080}
services.user.get-user=${USER_SERVICE_GET_USER:/internal/users}
services.user.connect-timeout=${USER_SERVICE_CONNECT_TIMEOUT:3s}
services.user.read-timeout=${USER_SERVICE_READ_TIMEOUT:5s}
# Enable only after User Service trusts Learning's internal issuer and signing keys.
services.user.internal-jwt-enabled=${USER_SERVICE_INTERNAL_JWT_ENABLED:false}

# Independent JWKS Service; no issuer discovery or User Service verification calls.
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.clock-skew=${JWT_CLOCK_SKEW:60s}

# Outbound service identity signing, independent of inbound user JWT validation.
app.security.internal-jwt.enabled=${LEARNING_INTERNAL_JWT_ENABLED:false}
app.security.internal-jwt.issuer=${LEARNING_INTERNAL_JWT_ISSUER:learning-service}
app.security.internal-jwt.audience=${LEARNING_INTERNAL_JWT_AUDIENCE:user-service}
app.security.internal-jwt.ttl=${LEARNING_INTERNAL_JWT_TTL:60s}

# Learning's own indexed private keys, supplied by .env.learning-api in Compose.
# Additional indexed keys bind directly through APP_SECURITY_SIGNING_KEYS_<n>_*.
app.security.signing.keys[0].kid=${APP_SECURITY_SIGNING_KEYS_0_KID:}
app.security.signing.keys[0].private-key-path=${APP_SECURITY_SIGNING_KEYS_0_PRIVATEKEYPATH:}
app.security.signing.keys[0].active=${APP_SECURITY_SIGNING_KEYS_0_ACTIVE:false}

# PostgreSQL: supply deployment-specific credentials; no credential defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Shared Phase 0 observability baseline; no remote backend is enabled here.
app.deployment-environment=${DEPLOYMENT_ENVIRONMENT:development}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
management.metrics.enable.all=${MANAGEMENT_METRICS_ENABLE_ALL:true}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}

# No destination exists yet. Keep exports off independently of local instrumentation.
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
management.logging.export.otlp.enabled=${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}

# OTel resource attributes are not JSON field names or proof of active SDK export.
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[service.version]=${app.version}
management.opentelemetry.resource-attributes[deployment.environment.name]=${app.deployment-environment}
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}

# Parent-based root sampling; remote parent decisions are preserved.
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# Application stdout stays JSON (JVM/JDWP native diagnostics are separate).
spring.main.banner-mode=off

# Phase 2: private scrape connector is opt-in for standalone runs; Compose enables it.
# Keep public health URLs unchanged. Never publish this additional listener to the host.
app.metrics.listener.enabled=${METRICS_LISTENER_ENABLED:false}
app.metrics.listener.port=${METRICS_LISTENER_PORT:9091}
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}

# Fixed SLO buckets support aggregatable quantiles without the larger generated bucket set.
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
management.metrics.distribution.slo.http.client.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
# Spring's default observations use route templates; do not add request/account identifiers.

# Phase 3: W3C only; baggage is neither collected nor forwarded.
# Standalone export remains opt-in; Compose supplies the internal destination.
management.tracing.propagation.type=w3c
management.tracing.baggage.enabled=false
management.tracing.baggage.correlation.enabled=false
management.tracing.baggage.remote-fields=
management.tracing.baggage.correlation.fields=
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.limits.max-attribute-value-length=256
spring.task.execution.propagate-context=true

# Security observations and metrics remain enabled; TracingConfiguration omits only their spans.
management.opentelemetry.tracing.sampler=parent-based-trace-id-ratio
